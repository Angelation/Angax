services:
  # Base de datos PostgreSQL (Render prefiere PostgreSQL)
  - type: postgres
    name: angax-database
    databaseName: angax
    user: angax_user
    plan: free
    ipAllowList: []

  # Backend Laravel
  - type: web
    name: angax-backend
    env: docker
    dockerfilePath: ./servidor/Dockerfile
    dockerContext: ./servidor
    plan: starter
    envVars:
      - key: APP_NAME
        value: AngaX
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          type: web
          name: angax-backend
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: angax-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: angax-database
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: angax-database
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: angax-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: angax-database
          property: password
    healthCheckPath: /up
    numInstances: 1

  # Frontend React
  - type: web
    name: angax-frontend
    env: docker
    dockerfilePath: ./cliente/Dockerfile
    dockerContext: ./cliente
    plan: starter
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: angax-backend
          property: host
          transform: https://$(host)/api
    numInstances: 1

