services:
  # Backend Laravel (usando SQLite embebido para el plan gratuito)
  - type: web
    name: angax-backend
    env: docker
    dockerfilePath: ./servidor/Dockerfile
    dockerContext: ./servidor
    plan: free
    envVars:
      - key: APP_NAME
        value: AngaX
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          type: web
          name: angax-backend
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
    healthCheckPath: /up
    numInstances: 1

  # Frontend React
  - type: web
    name: angax-frontend
    env: docker
    dockerfilePath: ./cliente/Dockerfile
    dockerContext: ./cliente
    plan: free
    buildCommand: echo "Building frontend..."
    envVars:
      - key: VITE_API_BASE_URL
        value: https://angax-backend.onrender.com/api
    numInstances: 1
